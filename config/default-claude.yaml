# Anthropic Messages API. export ANTHROPIC_API_KEY=...
# Chat: claude-opus-5. Anthropic has no image model, so texture maps use
# Gemini image generation: export GOOGLE_API_KEY=...
pipeline:
  max_trials: 3          # whole-pipeline retries after a failed trial
  max_steps: 3           # Designer rewrite / structure-refinement rounds per trial
  param_tuning_enabled: true
  dataset_workers: 1
  dataset_indices_path: data/index.jsonl

blender:
  executable_path: blender
  render:
    engine: CYCLES
    samples: 512
    resolution: [512, 512]
    device: GPU
    compute_device_type: CUDA   # or OPTIX
  camera:
    azimuth_angles: [45]
    elevation: 20
  scene:
    # Hero view for the final PNG. Critic/tuner also render plane + dark_ball internally.
    blend_file: data/agent_ball.blend
    render_mode: ball
    part_name: SolidModel

models:
  designer:          {provider: anthropic, model_id: claude-opus-5, api_base: null}
  classifier:        {provider: anthropic, model_id: claude-opus-5, api_base: null}
  critic:            {provider: anthropic, model_id: claude-opus-5, api_base: null}
  inspector:         {provider: anthropic, model_id: claude-opus-5, api_base: null}
  prompt_enricher:   {provider: anthropic, model_id: claude-opus-5, api_base: null}
  texture_generator: {provider: gemini, model_id: gemini-3.1-flash-image-preview, api_base: null}

image_metrics:
  model_path: Qwen/Qwen3-VL-Reranker-8B
  adapter_path: yuanze1024/ShaderAgent-MatScorer-Qwen3VLReranker-LoRA
  device: cuda
  dtype: bfloat16
  merge_lora: true

param_tuning:
  max_iter: 50           # numeric search steps per structure step
  max_params: 5
  seed: 42
  accept_prob: 0.05      # chance to keep a worse candidate
  momentum: 0.0
  log_range: 2.3         # log-uniform scale: exp(±log_range)
  color_sv_perturb: 0.2  # HSV S/V step
  hue_perturb: 0.15      # 0 keeps hue fixed
  bool_flip_prob: 0.2
  render_samples: 256
  render_resolution: 256

critic:
  good_enough_min: 0.8   # winner must clear this on every rubric dimension to stop
